name: Post perf comparison comment

on:
  # The comment must run after "Basic Tests" completes on a PR, which requires workflow_run.
  # zizmor: ignore[dangerous-triggers] the job only posts a comment and downloads the artifact by run id
  workflow_run:
    workflows: ["Basic Tests"]
    types: [completed]

# A new "Basic Tests" completion for the same head branch cancels the previous run.
concurrency:
  group: comment-perf-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comment:
    name: comment
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # post the perf comparison comment on the PR
    steps:
      - name: Download perf data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: perf-comment
          path: ${{ runner.temp }}/perf_tests/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout base repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          run-install: false
          post-cleanup: false
      - name: Apply workarounds
        run: |
          sed -i.bak 's@editable = true@editable = false@g' pyproject.toml
          rm pyproject.toml.bak
      - name: Render comparison
        env:
          PERF_DIR: ${{ runner.temp }}
        run: |
          pixi run -e py314 display-benchmark-comparison \
            --test-results-dir "$PERF_DIR/perf_tests/" \
            --md-output "$PERF_DIR/perf_tests/pretty.md"
      - name: Post comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PERF_DIR: ${{ runner.temp }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "" ]; then
            # For fork PRs, pull_requests is always empty — look up by head SHA
            PR_NUMBER=$(gh pr list --search "$HEAD_SHA" --state open --json number --jq '.[0].number')
          fi
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "" ]; then
            echo "No PR number found, skipping"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body-file "$PERF_DIR/perf_tests/pretty.md"
