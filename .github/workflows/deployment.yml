name: Publish Python 🐍 distribution 📦 to PyPI

on: push

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signurlarity
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    if: startsWith(github.ref, 'refs/tags/')  # only publish to PyPI on tag pushes
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.15"
    - name: Installing dependencies
      run: |
          python -m pip install \
              build \
              python-dateutil \
              pytz \
              readme_renderer[md] \
              requests \
              setuptools_scm
    - name: Validate README for PyPI
      run: |
        python -m readme_renderer README.md -o /tmp/README.html
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
