name: Release

on:
  push:
    branches:
      - master
  # Re-publish an existing tag after a failed publish. Run from master (pypi env).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.1.0)
        required: true

# Don't cancel: a queued run may be waiting on pypi approval.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Tags created with GITHUB_TOKEN trigger no workflows, so publish happens here.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          release-type: simple

  build:
    name: Build distribution 📦
    needs: release-please
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signurlarity
    permissions:
      id-token: write  # trusted publishing
    # !cancelled(): run even when release-please was skipped (manual run).
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch'
      )
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # hatch-vcs needs the tag to compute the version.
        ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.15"
    - name: Installing dependencies
      run: |
          python -m pip install build "readme_renderer[md]"
    - name: Validate README for PyPI
      run: |
        python -m readme_renderer README.md -o /tmp/README.html
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
