name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Opens/updates the release PR; once that PR is merged, creates the tag and the
  # GitHub release. It uses the job's own short-lived token, not a stored PAT.
  # Nothing done with that token starts another workflow, so publishing happens
  # in this workflow, gated on release_created (same layout as diracx-web).
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ github.token }}
          release-type: simple

  build:
    name: Build distribution 📦
    needs: release-please
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signurlarity
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    if: needs.release-please.outputs.release_created == 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # Build the release tag itself so hatch-vcs reads the release version.
        ref: ${{ needs.release-please.outputs.tag_name }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.15"
    - name: Installing dependencies
      run: |
          python -m pip install \
              build \
              python-dateutil \
              pytz \
              readme_renderer[md] \
              requests \
              setuptools_scm
    - name: Validate README for PyPI
      run: |
        python -m readme_renderer README.md -o /tmp/README.html
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
