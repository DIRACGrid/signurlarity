name: Release

# release-please (push to master) keeps the release PR up to date and, once it
# is merged, creates a *draft* GitHub release. Draft releases have no tag yet.
# A release manager reviews the draft and publishes it: that creates the tag
# (allowed by the `tags` ruleset, which github-actions cannot pass) and, being
# a human event, triggers the build and the PyPI publish below.
on:
  push:
    branches:
      - master
  release:
    types: [published]
  # Re-publish an existing tag after a failed publish. Run from master (pypi env).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (e.g. v0.1.0)
        required: true

# One group per event and ref: a push to master can never replace a queued
# publish (GitHub keeps only one pending run per group), and nothing is
# cancelled while it may be waiting on the pypi approval.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # release commit and draft GitHub release
      issues: write  # release labels
      pull-requests: write  # open and update the release PR
    steps:
      # Settings (draft releases, pre-1.0 bumps) live in release-please-config.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5

  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # hatch-vcs needs the tag to compute the version.
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.15"
    - name: Installing dependencies
      run: |
          python -m pip install build "readme_renderer[md]"
    - name: Validate README for PyPI
      run: |
        python -m readme_renderer README.md -o /tmp/README.html
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  # Only this job can get a PyPI token; the build above runs without it.
  publish:
    name: Publish distribution 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/signurlarity
    permissions:
      id-token: write  # trusted publishing
    steps:
    - name: Download the distribution packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
